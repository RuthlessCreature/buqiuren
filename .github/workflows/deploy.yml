name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SESSION_PEPPER: ${{ secrets.SESSION_PEPPER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MINIMAX_API_KEY ADMIN_PASSWORD SESSION_PEPPER; do
            if [ -z "${!name:-}" ]; then
              echo "Missing Actions secret: $name" >&2
              exit 1
            fi
          done
          if [ "${#SESSION_PEPPER}" -lt 32 ]; then
            echo "SESSION_PEPPER must be at least 32 characters" >&2
            exit 1
          fi

      - name: Install build tools and project environment
        run: |
          npm install --global wrangler@latest
          uv sync --all-groups

      - name: Resolve or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          DB_ID="$(wrangler d1 list --json | python -c 'import json,sys; xs=json.load(sys.stdin); print(next((x.get("uuid") or x.get("id") or "" for x in xs if x.get("name")=="buqiuren-db"), ""))')"
          if [ -z "$DB_ID" ]; then
            wrangler d1 create buqiuren-db --location apac
            DB_ID="$(wrangler d1 list --json | python -c 'import json,sys; xs=json.load(sys.stdin); print(next((x.get("uuid") or x.get("id") or "" for x in xs if x.get("name")=="buqiuren-db"), ""))')"
          fi
          if [ -z "$DB_ID" ]; then
            echo "Unable to resolve buqiuren-db database id" >&2
            exit 1
          fi
          cp wrangler.toml.example wrangler.toml
          sed -i "s/__D1_DATABASE_ID__/$DB_ID/g" wrangler.toml
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve Worker-compatible Python packages
        run: uv run pywrangler sync

      - name: Vendor pinned bazi engine after package sync
        run: |
          bash scripts/vendor_bazi.sh
          test "$(cat python_modules/buqiuren_bazi/UPSTREAM_COMMIT)" = "33b18354d5407727640e545c3aaec0efb4bf5282"

      - name: Ensure private R2 media bucket
        shell: bash
        run: |
          set -euo pipefail
          if ! out="$(wrangler r2 bucket create buqiuren-media 2>&1)"; then
            if ! printf '%s' "$out" | grep -Eqi 'already exists|already owned'; then
              printf '%s\n' "$out" >&2
              exit 1
            fi
          fi

      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n' | wrangler d1 migrations apply buqiuren-db --remote --config wrangler.toml

      - name: Configure Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$MINIMAX_API_KEY" | wrangler secret put MINIMAX_API_KEY --config wrangler.toml
          printf '%s' "$ADMIN_PASSWORD" | wrangler secret put ADMIN_PASSWORD --config wrangler.toml
          printf '%s' "$SESSION_PEPPER" | wrangler secret put SESSION_PEPPER --config wrangler.toml

      - name: Deploy Python Worker
        shell: bash
        run: |
          set -euo pipefail
          uv run pywrangler deploy --config wrangler.toml | tee deploy.log

      - name: Smoke-test deployed Worker
        shell: bash
        run: |
          set -euo pipefail
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -1 || true)"
          if [ -z "$URL" ]; then
            echo "Could not determine workers.dev URL from deployment output" >&2
            cat deploy.log
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$URL/health" | tee health.json
          python - <<'PY'
          import json
          d=json.load(open('health.json'))
          assert d['ok'] is True
          assert d['bazi_engine_commit']=='33b18354d5407727640e545c3aaec0efb4bf5282'
          print('Smoke test OK:', d)
          PY

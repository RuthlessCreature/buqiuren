name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Vendor exact upstream bazi revision
        run: bash scripts/vendor_bazi.sh
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Compile sources
        run: uv run python -m compileall -q src tests
      - name: Run tests
        env:
          PYTHONPATH: src
        run: uv run pytest -q
